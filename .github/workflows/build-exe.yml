name: build-exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TailRobot-windows-exe
          path: dist/TailRobot.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python build.py

      - name: Package app
        run: zip -ry dist/TailRobot-macos.zip dist/TailRobot.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TailRobot-macos-app
          path: dist/TailRobot-macos.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TailRobot-windows-exe
          path: release/TailRobot-windows
      - uses: actions/download-artifact@v4
        with:
          name: TailRobot-macos-app
          path: release/TailRobot-macos
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**
          generate_release_notes: true
          draft: false
          prerelease: false
